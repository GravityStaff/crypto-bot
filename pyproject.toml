[project]
name = "cryptobot"
version = "0.1.0"
dependencies = [
    "web3>=6.0.0",
    "pydantic-settings>=2.0.0",
    "click>=8.1.0",
    "pydantic>=2.0.0",
    "pyyaml>=6.0.0",
    "sqlalchemy>=2.0.0"
]

[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project.scripts]
cryptobot = "cryptobot.main:main"
